<title>Demo Vigia x Zumbis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Pixelify+Sans:wght@400;600;700&family=Barlow:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Demo de combate automático: palco grande do Marco Zero com o Vigia (IA) contra Errantes, Rastejantes e Corredores.
   HUD de fliperama por cima, controles embaixo, depois a explicação da IA de cada um. Tema escuro fixo. */
:root{ color-scheme:dark; --night:#120a1f; --panel:#1e1333; --panel2:#2a1b46; --line:#3d2a62; --ink:#f5eefe; --muted:#ac9dca;
  --blood:#ff2e4d; --moon:#ffd23f; --cosmic:#3ed4ff; --toxic:#8be35a;
  --f-display:"Bungee", Impact, "Arial Black", sans-serif; --f-pix:"Pixelify Sans", "Courier New", monospace; --f-body:"Barlow", "Segoe UI", system-ui, sans-serif; }
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 64px;
  background:radial-gradient(circle at 85% -10%, rgba(255,46,77,.22), transparent 40%), var(--night)}
:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:24px}
.eyebrow{font-family:var(--f-pix);text-transform:uppercase;letter-spacing:.12em;color:var(--cosmic);font-size:13px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,64px);line-height:.95;margin:4px 0 8px;text-shadow:4px 4px 0 var(--blood),8px 8px 0 #000}
h1 small{font-size:.4em;color:var(--moon);display:inline-block;vertical-align:.8em;margin-left:10px;text-shadow:3px 3px 0 #000}
.lede{max-width:76ch;color:var(--muted);margin:0} .lede b{color:var(--ink)}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,3vw,26px);margin:0 0 10px}
h2 small{display:block;font-family:var(--f-pix);font-size:13px;color:var(--blood);letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.game{border:3px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 0 0 6px #0b0614,10px 10px 0 6px rgba(255,46,77,.35);background:#000}
.stagewrap{position:relative;background:#000;overflow:hidden}
#stage{display:block;width:100%;height:auto;aspect-ratio:384/216;image-rendering:pixelated}
.hud{position:absolute;inset:8px 10px auto 10px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;flex-wrap:wrap}
.card{background:rgba(10,5,20,.85);border:2px solid #000;border-radius:6px;padding:5px 9px;font-family:var(--f-pix);font-size:13px;color:var(--muted);min-width:190px}
.card b{color:var(--ink);font-weight:700;letter-spacing:.04em}
.bar{height:8px;background:#2a1b46;border:1px solid #000;margin-top:3px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;display:block}
.hp i{background:linear-gradient(#8bff6a,#2fb04a)} .sp i{background:linear-gradient(#7ae0ff,#2a8ad8)} .sp.full i{background:linear-gradient(#fff2a0,#ffb020);animation:pulse .4s steps(2) infinite}
@keyframes pulse{50%{filter:brightness(1.4)}}
.wave{text-align:right}
.ia{position:absolute;left:10px;bottom:8px;font-family:var(--f-pix);font-size:12px;background:rgba(10,5,20,.82);border:2px solid #000;border-radius:5px;padding:3px 8px;color:var(--cosmic);pointer-events:none;max-width:70%}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(22px,5vw,52px);color:var(--moon);text-shadow:3px 3px 0 #000;-webkit-text-stroke:1.5px #000;pointer-events:none;display:none;white-space:nowrap}
.banner.go{left:auto;right:18px;transform:translateY(-50%);animation:blink .4s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fx{position:absolute;pointer-events:none;font-family:var(--f-display);color:#fff;transform:translate(-50%,-50%) rotate(-8deg);text-shadow:2px 2px 0 #000;-webkit-text-stroke:1px #000;font-size:clamp(14px,2.6vw,28px);white-space:nowrap;animation:rise .6s ease-out forwards}
.fx.burst{background:var(--moon);color:var(--blood);padding:2px 10px;-webkit-text-stroke:0;text-shadow:none;clip-path:polygon(0 30%,12% 22%,8% 0,28% 14%,40% 0,52% 16%,70% 2%,74% 20%,100% 12%,88% 40%,100% 60%,84% 70%,96% 100%,70% 84%,56% 100%,44% 82%,24% 98%,22% 76%,0 84%,10% 58%)}
.fx.dmg{font-family:var(--f-pix);font-weight:700;font-size:clamp(12px,1.8vw,18px);color:#fff;-webkit-text-stroke:0;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;transform:translate(-50%,-50%)}
.fx.dmg.big{color:var(--moon);font-size:clamp(14px,2.2vw,22px)}
.fx.hurt{font-family:var(--f-pix);font-weight:700;color:#ff6a6a;-webkit-text-stroke:0;text-shadow:1px 1px 0 #000;font-size:clamp(12px,1.8vw,18px);transform:translate(-50%,-50%)}
.fx.bubble{background:#fff;color:#000;-webkit-text-stroke:0;text-shadow:none;border:3px solid #000;border-radius:50%;padding:4px 12px;transform:translate(-50%,-50%) rotate(4deg)}
.fx.tag{font-family:var(--f-pix);font-size:clamp(12px,1.7vw,16px);background:#000;color:var(--moon);-webkit-text-stroke:0;border:2px solid var(--moon);border-radius:4px;padding:1px 7px;transform:translate(-50%,-50%);text-shadow:none}
@keyframes rise{0%{margin-top:6px;opacity:0}15%{opacity:1}100%{margin-top:-22px;opacity:0}}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:12px 14px;background:var(--panel);border-top:2px solid var(--line);font-family:var(--f-pix)}
.grp{display:grid;gap:6px;align-content:start}
.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-family:var(--f-pix);font-weight:600;font-size:13px;cursor:pointer;padding:6px 10px;border-radius:5px;border:2px solid var(--line);background:var(--panel2);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--moon);color:#1a0d00;border-color:#000;box-shadow:2px 2px 0 #000}
.seg button[data-mode="lua"][aria-pressed="true"]{background:var(--blood);color:#fff}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.box{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.box h3{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 6px}
.box p{margin:0 0 8px;color:var(--muted);font-size:15px}
ul.rules{margin:0;padding-left:20px;display:grid;gap:5px;color:var(--muted);font-size:15px}
ul.rules b{color:#fff}
.log{font-family:var(--f-pix);font-size:12px;color:var(--muted);max-height:180px;overflow:auto;background:#0d0818;border:1px solid var(--line);border-radius:6px;padding:8px;margin:0;list-style:none}
.log li{padding:1px 0;border-bottom:1px solid #1e1333}
.log b{color:var(--moon);font-weight:600}
@media (prefers-reduced-motion:reduce){ *{animation:none!important} }
</style>
